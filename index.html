<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    
    <!-- Updated Title -->
    <title>Quote Vault Pro | Explorer & Manager</title>
    
    <!-- Dynamic Favicon (Quote Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📖</text></svg>">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #3b82f6;
            --text: #f8fafc;
            --bg: #0f172a;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .container {
            padding: 16px;
            max-width: 1100px;
            margin: auto;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .url-preview-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px;
            margin-top: 15px;
            border: 1px solid rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #preview-url {
            font-family: monospace;
            font-size: 12px;
            color: #93c5fd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .tabs, .pages {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
            align-items: center;
        }

        .tab, .page {
            padding: 10px 18px;
            background: var(--glass);
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--glass-border);
            white-space: nowrap;
            transition: 0.3s;
            font-size: 14px;
            color: #cbd5e1;
        }

        .active {
            background: var(--accent) !important;
            color: white !important;
            border-color: var(--accent);
        }

        .page.dots { cursor: default; border: none; background: transparent; }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            outline: none;
        }

        button {
            background: var(--accent);
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        #quotes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .quote-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
            transition: transform 0.2s;
        }
        .quote-card:hover { transform: translateY(-5px); }

        .quoteText {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--glass-border);
            color: #94a3b8;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            padding: 5px 10px;
            font-size: 11px;
            width: auto;
            border-radius: 8px;
            color: #cbd5e1;
            cursor: pointer;
        }
        .item-copy-btn:hover { background: var(--accent); color: white; }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        @media (min-width: 600px) { .stats { grid-template-columns: repeat(4, 1fr); } }

        .stat-item {
            background: var(--glass);
            padding: 15px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--glass-border);
        }
        .stat-item b { display: block; font-size: 18px; color: var(--accent); }
        .stat-item span { font-size: 11px; text-transform: uppercase; color: #64748b; }
    </style>
</head>
<body>

<header>📖 QUOTE VAULT PRO</header>

<div class="container">

    <!-- API Config & URL Preview -->
    <div class="glass-card">
        <div style="display: flex; gap: 8px;">
            <input id="api" style="flex:1" value="https://script.google.com/macros/s/AKfycbxk6lpb3kDEq3xp9HdLekqwkF0uJ5cimOmd0iYjZP0g8KakzYrT38E_-LnHKPC-r_OW/exec">
            <button onclick="loadSheets()" style="width: auto;">Connect Engine</button>
        </div>
        
        <div class="url-preview-box">
            <span style="font-size: 10px; color: #64748b; font-weight: bold;">LIVE ENDPOINT:</span>
            <div id="preview-url">Awaiting connection...</div>
            <button style="width:auto; padding: 5px 10px; font-size: 11px;" onclick="copyText(document.getElementById('preview-url').textContent)">Copy</button>
        </div>
    </div>

    <div id="tabs" class="tabs"></div>

    <div class="glass-card">
        <div class="filters">
            <input id="search" placeholder="Search keywords...">
            <select id="month">
                <option value="">All Months</option>
                <option value="1">January</option><option value="2">February</option>
                <option value="3">March</option><option value="4">April</option>
                <option value="5">May</option><option value="6">June</option>
                <option value="7">July</option><option value="8">August</option>
                <option value="9">September</option><option value="10">October</option>
                <option value="11">November</option><option value="12">December</option>
            </select>
            <input type="date" id="from">
            <input type="date" id="to">
            <select id="limit">
                <option>10</option><option selected>20</option><option>50</option><option>100</option>
            </select>
            <button onclick="page=1;loadData()">Update Feed</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>
    <div id="quotes"></div>
    <div class="pages" id="pagination"></div>

</div>

<script>
let currentSheet = "tweets";
let page = 1;
let total = 0;

async function getJson(url) {
    const r = await fetch(url);
    return r.json();
}

async function loadSheets() {
    const api = document.getElementById('api').value;
    try {
        const sheets = await getJson(api + '?sheet=tweets&action=sheets');
        const box = document.getElementById('tabs');
        box.innerHTML = '';
        sheets.forEach(s => {
            let d = document.createElement('div');
            d.className = 'tab';
            d.textContent = s;
            d.onclick = () => {
                currentSheet = s;
                page = 1;
                document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
                d.classList.add('active');
                loadData();
            };
            box.appendChild(d);
        });
        if(sheets.length > 0) box.firstChild.click();
    } catch(e) { alert("Check API Connection"); }
}

async function loadData() {
    if (!currentSheet) return;
    const api = document.getElementById('api').value;
    const search = document.getElementById('search').value;
    const month = document.getElementById('month').value;
    const from = document.getElementById('from').value;
    const to = document.getElementById('to').value;
    const limit = document.getElementById('limit').value;

    let url = `${api}?sheet=${currentSheet}&page=${page}&limit=${limit}`;
    if (search) url += `&contains=${encodeURIComponent(search)}`;
    if (month) url += `&month=${month}`;
    if (from && to) url += `&from=${from}&to=${to}`;

    document.getElementById('preview-url').textContent = url;

    const res = await getJson(url);
    const data = res.data || [];
    total = res.total || data.length;

    document.getElementById('stats').innerHTML = `
        <div class="stat-item"><b>${total}</b><span>Quotes</span></div>
        <div class="stat-item"><b>${page}</b><span>Page</span></div>
        <div class="stat-item"><b>${limit}</b><span>Limit</span></div>
        <div class="stat-item"><b>${currentSheet}</b><span>Source</span></div>
    `;

    const quotesContainer = document.getElementById('quotes');
    quotesContainer.innerHTML = '';

    data.forEach((r) => {
        const text = r.content || r.quote || r.text || "";
        const rawDate = r.datetime || r.date || '';
        let dateStr = rawDate ? new Date(rawDate).toLocaleDateString() : 'No Date';

        let div = document.createElement('div');
        div.className = 'glass-card quote-card';
        
        // Sanitize for onclick
        const escapedText = text.replace(/`/g, '\\`').replace(/\$/g, '\\$');

        div.innerHTML = `
            <div class="quoteText">${text}</div>
            <div class="meta">
                <span>📅 ${dateStr}</span>
                <div class="item-actions">
                    <button class="item-copy-btn" onclick="copyQuote(this, \`${escapedText}\`)">📋 Copy</button>
                    <span>❤️ ${r.likes || 0}</span>
                    <span>👁️ ${r.views || 0}</span>
                </div>
            </div>`;
        quotesContainer.appendChild(div);
    });

    buildPagination(parseInt(limit));
}

function buildPagination(limit) {
    const totalPages = Math.ceil(total / limit);
    const box = document.getElementById('pagination');
    box.innerHTML = '';
    if (totalPages <= 1) return;

    const createBtn = (p, label, isActive = false, isDots = false) => {
        let d = document.createElement('div');
        d.className = `page ${isActive ? 'active' : ''} ${isDots ? 'dots' : ''}`;
        d.textContent = label;
        if (!isActive && !isDots) {
            d.onclick = () => { page = p; loadData(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
        }
        return d;
    };

    if (page > 1) box.appendChild(createBtn(page - 1, '◀ Prev'));
    box.appendChild(createBtn(1, '1', page === 1));

    let start = Math.max(2, page - 2);
    let end = Math.min(totalPages - 1, page + 2);

    if (start > 2) box.appendChild(createBtn(0, '...', false, true));
    for (let i = start; i <= end; i++) {
        box.appendChild(createBtn(i, i, page === i));
    }
    if (end < totalPages - 1) box.appendChild(createBtn(0, '...', false, true));

    if (totalPages > 1) box.appendChild(createBtn(totalPages, totalPages, page === totalPages));
    if (page < totalPages) box.appendChild(createBtn(page + 1, 'Next ▶'));
}

function copyQuote(btn, text) {
    navigator.clipboard.writeText(text);
    const original = btn.innerHTML;
    btn.innerHTML = "✅ Saved";
    btn.style.borderColor = "#22c55e";
    setTimeout(() => {
        btn.innerHTML = original;
        btn.style.borderColor = "var(--glass-border)";
    }, 1500);
}

function copyText(val) {
    navigator.clipboard.writeText(val);
    alert("Copied to clipboard!");
}

window.onload = loadSheets;
</script>
</body>
</html>
